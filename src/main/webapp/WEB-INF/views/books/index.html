<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Книги</title>
</head>
<body>

<h1>Список книг</h1>

<div th:each="book : ${books}">
    <a th:href="@{/books/{id}(id=${book.id})}"
       th:text="${book.title + ' — ' + book.author + ', ' + book.year}">
        Книга
    </a>
</div>

<br/>
<hr/>

<a href="/books/new">Добавить новую книгу</a>

<br/>

<a href="/books/search">Поиск книги</a>

</body>
</html>
