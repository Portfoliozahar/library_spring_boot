<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Поиск книги</title>
</head>
<body>

<h1>Поиск книги</h1>

<form th:action="@{/books/search}" method="post">

    <label>Введите начало названия:</label>

    <input type="text" name="title">

    <input type="submit" value="Поиск">

</form>

<hr>

<div th:if="${books != null}">

    <div th:if="${books.isEmpty()}">
        Книги не найдены
    </div>

    <div th:each="book : ${books}">

        <p>
            <strong th:text="${book.title}"></strong>
            —
            <span th:text="${book.author}"></span>
        </p>

        <p th:if="${book.owner != null}">
            Владелец:
            <span th:text="${book.owner.name}"></span>
        </p>

        <p th:if="${book.owner == null}">
            Книга свободна
        </p>

        <hr>

    </div>

</div>

<a th:href="@{/books}">← Все книги</a>

</body>
</html>
