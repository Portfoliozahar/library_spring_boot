<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить книгу</title>
</head>
<body>

<h1>Добавление новой книги</h1>

<form th:method="POST" th:action="@{/books}" th:object="${book}">

    <label for="title">Название:</label>
    <input type="text" id="title" th:field="*{title}"/>
    <br/>
    <div style="color:red"
         th:if="${#fields.hasErrors('title')}"
         th:errors="*{title}">
        Ошибка
    </div>

    <br/>

    <label for="author">Автор:</label>
    <input type="text" id="author" th:field="*{author}"/>
    <br/>
    <div style="color:red"
         th:if="${#fields.hasErrors('author')}"
         th:errors="*{author}">
        Ошибка
    </div>

    <br/>

    <label for="year">Год:</label>
    <input type="text" id="year" th:field="*{year}"/>
    <br/>
    <div style="color:red"
         th:if="${#fields.hasErrors('year')}"
         th:errors="*{year}">
        Ошибка
    </div>

    <br/>

    <input type="submit" value="Добавить"/>

</form>

<br/>
<hr/>

<a href="/books">Вернуться к списку книг</a>

</body>
</html>
