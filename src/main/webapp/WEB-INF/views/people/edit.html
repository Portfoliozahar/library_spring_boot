<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование читателя</title>
</head>
<body>

<h1>Редактирование читателя</h1>

<form th:method="PATCH"
      th:action="@{/people/{id}(id=${person.id})}"
      th:object="${person}">

    <label for="name">ФИО:</label>
    <input type="text" id="name" th:field="*{name}"/>
    <br/>
    <div style="color:red"
         th:if="${#fields.hasErrors('name')}"
         th:errors="*{name}">
        Ошибка
    </div>

    <br/>

    <label for="age">Год рождения:</label>
    <input type="text" id="age" th:field="*{age}"/>
    <br/>
    <div style="color:red"
         th:if="${#fields.hasErrors('age')}"
         th:errors="*{age}">
        Ошибка
    </div>

    <br/>

    <input type="submit" value="Сохранить"/>

</form>

<br/>
<hr/>

<a href="/people">Вернуться к списку читателей</a>

</body>
</html>
